name: Phase 0-1 Verify

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase-0-1-flight-room
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import and test project
        run: python tools/verify/verify.py

  export-windows:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Windows export templates
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/export_templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz"
          mkdir -p /tmp/export_templates
          unzip -q /tmp/export_templates.tpz -d /tmp/export_templates
          template_dir="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          mkdir -p "$template_dir"
          cp -R /tmp/export_templates/templates/. "$template_dir/"

      - name: Verify and export Windows prototype
        run: python tools/verify/verify.py --export-windows

      - name: Upload Windows prototype
        uses: actions/upload-artifact@v4
        with:
          name: STRATOSPHERE-Phase-0-1-Windows
          path: build/windows/
          if-no-files-found: error
          retention-days: 14