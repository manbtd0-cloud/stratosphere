name: Generate VTOL Blockout

on:
  push:
    branches:
      - agent/phase-0-1-flight-room
    paths:
      - tools/blender/generate_vtol_blockout.py
      - .github/workflows/generate-vtol-blockout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-0-1-flight-room
          fetch-depth: 0

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --yes blender
          blender --version

      - name: Adapt preview renderer for runner Blender
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/blender/generate_vtol_blockout.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              'scene.render.engine = "BLENDER_EEVEE_NEXT"',
              'scene.render.engine = "BLENDER_EEVEE"',
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Generate source and runtime assets
        run: |
          blender --background --python tools/blender/generate_vtol_blockout.py
          test -s assets/source/vtol_blockout.blend
          test -s assets/generated/vtol_blockout.glb
          ls -lh assets/source/vtol_blockout.blend assets/generated/vtol_blockout.glb

      - name: Commit generated assets
        shell: bash
        run: |
          git checkout -- tools/blender/generate_vtol_blockout.py
          git config user.name "stratosphere-asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/source/vtol_blockout.blend assets/generated/vtol_blockout.glb
          if git diff --cached --quiet; then
            echo "Generated assets are unchanged."
            exit 0
          fi
          git commit -m "assets: regenerate VTOL blockout [skip ci]"
          git fetch origin agent/phase-0-1-flight-room
          git rebase origin/agent/phase-0-1-flight-room
          git push origin HEAD:agent/phase-0-1-flight-room
